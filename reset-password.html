<!DOCTYPE html>
<html class="others">
<head>
    <meta charset="UTF-8">
    <title>Reset Password – Course Guide</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div id="body_equ">
        <img id="on-top-logo" src="Logos/Logo.svg" alt="Course Guide Logo">
        <div class="frame" id="frame1">
            <div id="reset-panel" class="auth-panel">
                <span class="auth-title">Reset Password</span>
                <div class="frame" id="frame2">
                    <form id="reset-form" class="auth-form">
                        <label for="reset-password">New Password</label>
                        <input type="password" id="reset-password" class="clean" placeholder="Enter new password" required minlength="6">
                        
                        <label for="reset-confirm">Confirm Password</label>
                        <input type="password" id="reset-confirm" class="clean" placeholder="Confirm new password" required>
                        
                        <div id="reset-error" class="auth-error" style="display:none;"></div>
                        <div id="reset-success" class="auth-error" style="display:none; background:#e6ffed; color:#0b6623; border-color:#a3d9a5;"></div>
                        
                        <input id="submit-reset" type="submit" value="Reset Password">
                    </form>
                </div>
                <p class="switch-text"><a href="login.html" style="color:#ffffff;">← Back to Login</a></p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://ssguide.local/wp-json';

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const resetKey = urlParams.get('key');
        const userId = urlParams.get('user');

        // If no key or user, show error
        if (!resetKey || !userId) {
            document.getElementById('reset-error').textContent = 'Invalid reset link. Please request a new one.';
            document.getElementById('reset-error').style.display = 'block';
            document.getElementById('submit-reset').disabled = true;
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('reset-password').value.trim();
            const confirm = document.getElementById('reset-confirm').value.trim();
            
            const errorEl = document.getElementById('reset-error');
            const successEl = document.getElementById('reset-success');
            
            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (password.length < 6) {
                errorEl.textContent = 'Password must be at least 6 characters.';
                errorEl.style.display = 'block';
                return;
            }

            if (password !== confirm) {
                errorEl.textContent = 'Passwords do not match.';
                errorEl.style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/ssguide/v1/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        key: resetKey,
                        user: userId,
                        new_password: password
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || 'Reset failed.');
                }

                successEl.textContent = data.message + ' Redirecting to login...';
                successEl.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = 'login.html?reset=1';
                }, 3000);

            } catch (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
