<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Course Guide - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="body_equ">
        <img id="on-top-logo" src="Logos/Logo.svg" alt="Course Guide Logo">

        <div class="frame" id="frame1">
            <!-- ========== LOGIN FORM ========== -->
            <div id="login-panel" class="auth-panel">
                <span class="auth-title">Login</span>
                <div class="frame" id="frame2">
                    <form id="login-form" class="auth-form">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" class="clean" placeholder="example@gmail.com" required>

                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" class="clean" placeholder="••••••••" required>

                        <input id="submit-login" type="submit" value="Log In">
                    </form>
                </div>
                <p class="switch-text">Don't have an account? <span id="show-register">Register here</span></p>
            </div>

            <!-- ========== REGISTRATION FORM (hidden by default) ========== -->
            <div id="register-panel" class="auth-panel" style="display: none;">
                <span class="auth-title">Create Account</span>
                <div class="frame" id="frame2">
                    <form id="register-form" class="auth-form">
                        <label for="reg-name">Full Name</label>
                        <input type="text" id="reg-name" class="clean" placeholder="John Doe" required>

                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" class="clean" placeholder="example@gmail.com" required>

                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" class="clean" placeholder="Create a password" required>

                        <input id="submit-register" type="submit" value="Register">
                    </form>
                </div>
                <p class="switch-text">Already have an account? <span id="show-login">Log in</span></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('show-register').addEventListener('click', () => {
            document.getElementById('login-panel').style.display = 'none';
            document.getElementById('register-panel').style.display = 'flex';
        });

        document.getElementById('show-login').addEventListener('click', () => {
            document.getElementById('register-panel').style.display = 'none';
            document.getElementById('login-panel').style.display = 'flex';
        });

        // ========== API base (change when live) ==========
        const API_BASE = 'http://ssguide.local/wp-json';

        // ========== Login handler ==========
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(`${API_BASE}/jwt-auth/v1/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: email, password })
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || 'Login failed');
                }
                const data = await res.json();
                localStorage.setItem('jwtToken', data.token);
                // Redirect to main dashboard page
                window.location.href = 'index.html';
            } catch (error) {
                alert(error.message);
            }
        });

        // ========== Registration handler ==========
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            try {
                // This endpoint requires the WP REST User plugin or a custom route
                const res = await fetch(`${API_BASE}/wp/v2/users/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: email, email, password, display_name: name })
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || 'Registration failed');
                }
                alert('Account created! Please log in.');
                // Switch to login panel
                document.getElementById('show-login').click();
            } catch (error) {
                alert(error.message);
            }
        });
    </script>   <!-- we'll add the JS below -->
</body>
</html>
