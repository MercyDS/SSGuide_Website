<!DOCTYPE html>
<html class="others">
    <head>
        <meta charset="UTF-8">
        <title>Course Guide - Login</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="login-page">
        <div id="body_equ">
            <img id="on-top-logo" src="Logos/Logo.svg" alt="Course Guide Logo">

            <div class="frame" id="frame1">
                <!-- ========== LOGIN FORM ========== -->
                <div id="login-panel" class="auth-panel">
                    <span class="auth-title">Login</span>
                    <div class="frame" id="frame2">
                        <form id="login-form" class="auth-form">
                            <label for="login-username">Username</label>
                            <input type="text" id="login-username" class="clean" placeholder="Enter your username" required>

                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" class="clean" placeholder="••••••••" required>

                            <div style="text-align: right; margin-top: -8px; margin-bottom: 8px;">
                                <a href="#" id="forgot-password-link" style="color: #dcd0e6; font-size: 13px; text-decoration: underline;">Forgot password?</a>
                            </div>

                            <div id="login-error" class="auth-error" style="display: none;"></div>

                            <input id="submit-login" type="submit" value="Log In">
                        </form>
                    </div>
                    <p class="switch-text">Don't have an account? <span id="show-register">Register here</span></p>
                </div>

                <!-- ========== REGISTRATION FORM (hidden by default) ========== -->
                <div id="register-panel" class="auth-panel" style="display: none;">
                    <span class="auth-title">Create Account</span>
                    <div class="frame" id="frame2">
                        <form id="register-form" class="auth-form">
                            <label for="reg-username">Username</label>
                            <input type="text" id="reg-username" class="clean" placeholder="Choose a username" required>

                            <label for="reg-email">Email</label>
                            <input type="email" id="reg-email" class="clean" placeholder="example@gmail.com" required>

                            <label for="reg-password">Password</label>
                            <input type="password" id="reg-password" class="clean" placeholder="Create a password" required>

                             <div id="register-error" class="auth-error" style="display: none;"></div> <!--New line to add my own error report-->

                            <input id="submit-register" type="submit" value="Register">
                        </form>
                    </div>
                    <p class="switch-text">Already have an account? <span id="show-login">Log in</span></p>
                </div>
            </div>
        </div>

        <script>
            const API_BASE = 'https://finishing-definition-amplifier-created.trycloudflare.com/wp-json';

            // ─── CHECK URL PARAMS FOR VERIFICATION STATUS ──────
            window.addEventListener('DOMContentLoaded', function() {
                const urlParams = new URLSearchParams(window.location.search);
            
                if (urlParams.get('verified') === '1') {
                    const errorEl = document.getElementById('login-error');
                    errorEl.style.display = 'block';
                    errorEl.style.backgroundColor = '#e6ffed';
                    errorEl.style.color = '#0b6623';
                    errorEl.style.borderColor = '#a3d9a5';
                    errorEl.textContent = '✅ Email verified! You can now log in.';
                }
            
                if (urlParams.get('reset') === '1') {
                    const errorEl = document.getElementById('login-error');
                    errorEl.style.display = 'block';
                    errorEl.style.backgroundColor = '#e6ffed';
                    errorEl.style.color = '#0b6623';
                    errorEl.style.borderColor = '#a3d9a5';
                    errorEl.textContent = '✅ Password reset successful! You can now log in.';
                }
            });

            // ---------- HELPER: Show/hide inline errors ----------
            function showError(elementId, message) {
                const el = document.getElementById(elementId);
                el.textContent = message;
                el.style.display = 'block';
            }
            function hideError(elementId) {
                const el = document.getElementById(elementId);
                el.style.display = 'none';
                el.textContent = '';
            }
            function stripHtml(html){
                const temp = document.createElement('div');
                temp.innerHTML = html;
                return temp.textContent || temp.innerText || '';
            }

            //Helper to check if the wordpress server is reachable
            async function isServerOnline(){
                try {
                    const res = await fetch(`${API_BASE}`, {method: 'GET' });
                    return true;
                } catch (_) {
                    return false;
                }
            }

            // ---------- TOGGLE FORMS ----------
            document.getElementById('show-register').addEventListener('click', () => {
                document.getElementById('login-panel').style.display = 'none';
                document.getElementById('register-panel').style.display = 'flex';
                hideError('register-error');   // clear any old error
            });
            document.getElementById('show-login').addEventListener('click', () => {
                document.getElementById('register-panel').style.display = 'none';
                document.getElementById('login-panel').style.display = 'flex';
                hideError('login-error');
            });
            // ---------- LOGIN ----------
            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('login-username').value.trim();
                const password = document.getElementById('login-password').value.trim();

                hideError('login-error');

                if (!username || !password) {
                    showError('login-error', 'Please fill in both username and password.');
                    return;
                }

                const online = await isServerOnline();
                if (!online){
                    showError('login-error', 'The server appears to be offline. Please try again later.')
                    return;
                }

                try {
                    const res = await fetch(`${API_BASE}/jwt-auth/v1/token`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    let data;
                    try {
                        data = await res.json();
                    } catch (jsonError) {
                        showError('login-error', 'Unexpected server response. Please try again later.');
                        return;
                    }

                    if (!res.ok) {
                        let rawMessage = data?.message || 'Login failed. Please check your credentials.';
                        let message = stripHtml(rawMessage);
                        
                        // Special handling for unverified emails
                        if (rawMessage.includes('verify your email')) {
                            message = '📧 ' + rawMessage + ' If you didn\'t receive the email, please check your spam folder or contact support.';
                        }
                        
                        showError('login-error', message);
                        return;
                    }

                                       // Success
                    localStorage.setItem('jwtToken', data.token);

                    // Check role via custom endpoint
                    fetch(`${API_BASE}/ssguide/v1/me`, {
                        headers: { 'Authorization': `Bearer ${data.token}` }
                    })
                    .then(r => r.json())
                    .then(user => {
                        const roles = user.roles || [];
                        if (roles.includes('counselor')) {
                            window.location.href = 'counselor.html';
                        } else {
                            window.location.href = 'main.html';
                        }
                    })
                    .catch(() => {
                        window.location.href = 'main.html';
                    });
                } catch (error) {
                    // Network or unexpected error
                    showError('login-error', 'A network error occurred. Please check your connection.');
                }
            });

            // ---------- REGISTER ----------
            document.getElementById('register-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('reg-username').value.trim();
                const email = document.getElementById('reg-email').value.trim();
                const password = document.getElementById('reg-password').value.trim();
                hideError('register-error');
                if (!username || !email || !password) {
                    showError('register-error', 'Please fill in all fields.');
                    return;
                }
                const online = await isServerOnline();
                if (!online){
                    showError('register-error','The server appears to be ofline. Please start your local site and try again.');
                    return;
                }

                try {
                    const res = await fetch(`${API_BASE}/wp/v2/users/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, email, password })
                    });
                    let data;
                    try {
                        data = await res.json();
                    } catch (jsonError) {
                        showError('register-error', 'Unexpected server response. Please try again later.');
                        return;
                    }
                    if (!res.ok) {
                        const rawMessage = data?.message || 'Registration failed. Please try again.';
                        const message = stripHtml(rawMessage);
                        showError('register-error', message);
                        return;
                    }
                    // Success – green message, then switch to login
                    const regError = document.getElementById('register-error');
                    regError.style.color = '#0b6623';
                    regError.style.backgroundColor = '#e6ffed';
                    regError.style.borderColor = '#a3d9a5';
                    regError.textContent = '📧 Account created! Please check your email for the verification link before logging in.';
                    regError.style.display = 'block';
                    setTimeout(() => {
                        document.getElementById('show-login').click();
                        // Reset colours
                        regError.style.color = '';
                        regError.style.backgroundColor = '';
                        regError.style.borderColor = '';
                        hideError('register-error');
                    }, 3000); // Increased to 3 seconds so users can read the message
                } catch (error) {
                    showError('register-error', 'A network error occurred. Please check your connection.');
                }
            });

            // ─── FORGOT PASSWORD ────────────────────────────────
            document.getElementById('forgot-password-link')?.addEventListener('click', async (e) => {
                e.preventDefault();
            
                const email = prompt('Enter your registered email address to receive a password reset link:');
                if (!email) return;
            
                const errorEl = document.getElementById('login-error');
            
                try {
                    const res = await fetch(`${API_BASE}/ssguide/v1/forgot-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                
                    const data = await res.json();
                
                    if (!res.ok) {
                        throw new Error(data.message || 'Request failed.');
                    }
                
                    alert('✅ ' + data.message);
                } catch (error) {
                    alert('❌ ' + error.message);
                }
            });

        </script>
    </body>
</html>
